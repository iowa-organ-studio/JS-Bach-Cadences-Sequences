<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>J. S. Bach</title><link rel="stylesheet" href="style.css"><script src="https://www.verovio.org/javascript/latest/verovio-toolkit-wasm.js"></script><script src="https://www.verovio.org/javascript/latest/verovio-toolkit-hum.js"></script><script type="module" src="js/student-login.js"></script><script type="module" src="js/exercise-history.js"></script><script type="module" src="js/js-bach.js"></script></head><body>
<header class="top"><div class="identity"><div class="mark">♫</div><div><h1>J. S. Bach</h1></div></div><button id="loginToggle" class="outline" type="button">♙ Student login</button></header>
<main><section id="loginPanel" class="login" hidden><div class="loginhead"><strong>Student login</strong><button id="loginClose" type="button" aria-label="Close login">✕</button></div><div id="studentLoggedOut"><form id="studentLoginForm"><label for="studentUidInput">Eight-digit student UID</label><div class="login-form-row"><input id="studentUidInput" type="text" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" autocomplete="off" placeholder="Student UID" required><button class="new login-submit" type="submit">Sign in</button></div></form></div><div id="studentLoggedIn" hidden><span id="studentLoginName"></span><button class="outline" id="studentLogoutButton" type="button">Log out</button></div><p id="studentLoginMessage" role="status" aria-live="polite"></p></section>
<div class="practice-grid" id="practiceGrid"><section class="music card"><div class="pills"><span class="pill" id="titlePill">Loading exercise…</span><span class="pill" id="keyPillValue">—</span></div><div class="score"><div id="svg" aria-label="Music notation">Loading music…</div><p id="instructionsBox" class="exercise-instructions" hidden></p><div class="signature"><img src="jsbach.png" alt="Johann Sebastian Bach signature" loading="lazy"></div></div><button id="next" class="new" type="button">✦ New bass line →</button></section><div class="practice-sidebar"><section class="card keycard"><h2>Choose your keys</h2><div id="keyWheel"></div><p id="keyCount" aria-live="polite"></p></section>
<section class="card display"><div class="category-buttons" aria-label="Choose exercise types"><button type="button" class="category active" data-category="cadences" aria-pressed="true">Cadences</button><button type="button" class="category" data-category="sequences" aria-pressed="false">Sequences</button></div><div class="control"><label for="scale">Scale <output id="scaleValue">50%</output></label><input id="scale" type="range" min="25" max="80" value="50"></div><div class="control"><label for="spacing">Spacing <output id="spacingValue">0.32</output></label><input id="spacing" type="range" min="0.15" max="0.8" step="0.01" value="0.32"></div><div class="options"><div class="option-row"><span>Figure mode</span><div class="choices" data-setting="figureMode"><button type="button" data-value="historic" class="active">Historic</button><button type="button" data-value="modern">Modern</button></div></div><div class="option-row"><span>Double length</span><div class="choices" data-setting="doubleLength"><button type="button" data-value="on" class="active">On</button><button type="button" data-value="off">Off</button></div></div><div class="option-row"><span>Figure placement</span><div class="choices" data-setting="placement"><button type="button" data-value="above">Above</button><button type="button" data-value="below" class="active">Below</button></div></div></div></section></div></div>
<div class="bottom"><button id="exerciseHistoryButton" class="outline" type="button">◷ My practice history</button></div><dialog id="exerciseHistoryDialog" aria-labelledby="historyHeading"><div class="history-head"><h2 id="historyHeading">My practice history</h2><button id="closeExerciseHistory" class="outline" type="button">Close</button></div><div id="exerciseHistoryContent">Loading history…</div></dialog></main><footer><img src="Organ-Studio-LockupStacked-RGB.svg" alt="University of Iowa Organ Studio"></footer></body></html>
